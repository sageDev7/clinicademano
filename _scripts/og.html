<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:1200px}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;background:linear-gradient(115deg,#F4F2EE 0%,#ECE9E3 60%,#E4DFD6 100%);color:#25221E;text-align:center;position:relative}
body::before{content:"";position:absolute;inset:48px;border:2px solid rgba(176,138,82,.55)}
.tile{display:grid;place-items:center;width:260px;height:260px;background:linear-gradient(140deg,#E6C893 0%,#C9A160 48%,#8A7045 100%);color:#fff;font:400 190px/1 "Marcellus",serif;text-shadow:0 5px 6px rgba(90,66,30,.35)}
h1{margin:0;font:400 104px/1 "Marcellus",serif;letter-spacing:.06em;text-transform:uppercase}
p{margin:0;font:700 28px "Mulish",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#7E663E}
</style></head><body>
<div class="tile">M</div>
<h1>Clínica de Mano</h1>
<p>Cirugía de la mano · Mendoza</p>
</body></html>
